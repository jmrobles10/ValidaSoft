# Integración continua (docs/04 §11, SE-7). En cada push y en cada pull request:
#   backend   -> dotnet build (TreatWarningsAsErrors: una advertencia de compilación rompe el build) y dotnet test
#                (las pruebas de integración levantan PostgreSQL y MinIO con Testcontainers: el runner ya trae Docker).
#   frontend  -> pnpm install --frozen-lockfile, lint, typecheck, test y build.
#   e2e       -> Playwright contra la API que sirve las dos apps, con PostgreSQL, Mailpit y MinIO reales (e2e/).
#   imagen    -> construye la imagen de la API con el frontend (src/Validasoft.Api/Dockerfile) sin publicarla.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Caché de NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore Validasoft.slnx

      - name: Compilar (0 advertencias)
        run: dotnet build Validasoft.slnx --configuration Release --no-restore

      - name: Probar (dominio e integración con Testcontainers)
        run: >-
          dotnet test Validasoft.slnx --configuration Release --no-build
          --logger "trx;LogFilePrefix=resultados" --results-directory TestResults

      # Que el empaquetado de los SDK no se pudra entre publicaciones (docs/08 §2.3): sin publicar nada.
      - name: Empaquetar el SDK .NET (sin publicar)
        run: |
          dotnet pack src/Validasoft.Contratos/Validasoft.Contratos.csproj --configuration Release --no-build --output artefactos/nuget
          dotnet pack src/Validasoft.Sdk/Validasoft.Sdk.csproj --configuration Release --no-build --output artefactos/nuget

      - name: Paquetes con vulnerabilidades conocidas (informativo)
        if: always()
        run: dotnet list Validasoft.slnx package --vulnerable --include-transitive

      - name: Publicar resultados de las pruebas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-pruebas-backend
          path: TestResults/
          retention-days: 7

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Sin `version`: usa la de `packageManager` en package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

      # El paquete npm del SDK trae ESM y CJS: las dos salidas cargan y validan un webhook firmado.
      - name: Paquete npm del SDK (ESM y CJS)
        run: node infra/sdk/verificar-paquete.mjs

  e2e:
    name: Pruebas de punta a punta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # PostgreSQL, Mailpit (correo) y MinIO (archivos) como en desarrollo; la API los usa con appsettings.Development.json.
      - name: Servicios
        run: docker compose -f infra/compose/compose.yaml up -d --wait postgres mailpit minio

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Navegador
        run: pnpm --filter @validasoft/e2e exec playwright install --with-deps chromium

      # playwright.config.ts levanta la API (e2e/soporte/api.mjs): compila las dos apps, publica la API y la sirve en :5090.
      - name: Probar
        run: pnpm --filter @validasoft/e2e test

      - name: Publicar informe y trazas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-informe
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  imagen:
    name: Imagen Docker (sin publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Validasoft.Api/Dockerfile
          push: false
          tags: validasoft/app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
