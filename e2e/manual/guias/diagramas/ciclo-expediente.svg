<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 636" class="diagrama" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Ciclo de vida de un expediente</title>
<desc id="descripcion">Estados del expediente (abierto, en revisión, observado, aprobado, rechazado, anulado y caducado), con sus transiciones, y qué ocurre dentro de la revisión: etapas en secuencia, áreas en paralelo y verificaciones que bloquean el cierre.</desc>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca" d="M0 0L10 5L0 10z"/></marker><marker id="f-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-a" d="M0 0L10 5L0 10z"/></marker><marker id="f-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-ok" d="M0 0L10 5L0 10z"/></marker><marker id="f-peligro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-peligro" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="d-grupo" x="10" y="20" width="440" height="270" rx="14"/>
<text class="d-t-s" x="24" y="38">Expediente en curso</text>
<rect class="d-caja-gris" x="30" y="60" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="105" y="83">Abierto</text>
<text class="d-t-s d-c" x="105" y="100">el tercero carga</text>
<rect class="d-caja-a" x="270" y="60" width="160" height="60" rx="10"/>
<text class="d-t-b d-c" x="350" y="83">EnRevision</text>
<text class="d-t-s d-c" x="350" y="100">revisan las áreas</text>
<rect class="d-caja-aviso" x="270" y="210" width="160" height="60" rx="10"/>
<text class="d-t-b d-c" x="350" y="233">Observado</text>
<text class="d-t-s d-c" x="350" y="250">espera al tercero</text>
<path class="d-l" d="M180 90 L270 90" marker-end="url(#f)"/>
<rect class="d-rotulo" x="192" y="71" width="66" height="16" rx="4"/>
<text class="d-t-s d-c" x="225" y="83">carga lista</text>
<path class="d-l" d="M310 120 L310 210" marker-end="url(#f)"/>
<rect class="d-rotulo" x="284" y="139" width="52" height="16" rx="4"/>
<text class="d-t-s d-c" x="310" y="151">observar</text>
<path class="d-l" d="M390 210 L390 120" marker-end="url(#f)"/>
<rect class="d-rotulo" x="364" y="169" width="52" height="16" rx="4"/>
<text class="d-t-s d-c" x="390" y="181">reenviar</text>
<rect class="d-caja-ok" x="540" y="60" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="615" y="83">Aprobado</text>
<text class="d-t-s d-c" x="615" y="100">cierra el expediente</text>
<path class="d-l-ok" d="M430 80 L540 80" marker-end="url(#f-ok)"/>
<rect class="d-rotulo" x="461" y="61" width="48" height="16" rx="4"/>
<text class="d-t-s d-c" x="485" y="73">aprobar</text>
<path class="d-l" d="M540 104 L430 104" marker-end="url(#f)"/>
<rect class="d-rotulo" x="453" y="105" width="64" height="16" rx="4"/>
<text class="d-t-s d-c" x="485" y="117">desaprobar</text>
<rect class="d-caja-peligro" x="540" y="210" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="615" y="233">Rechazado</text>
<text class="d-t-s d-c" x="615" y="250">terminal</text>
<path class="d-l-peligro" d="M450 240 L540 240" marker-end="url(#f-peligro)"/>
<rect class="d-rotulo" x="469" y="221" width="52" height="16" rx="4"/>
<text class="d-t-s d-c" x="495" y="233">rechazar</text>
<rect class="d-caja-aviso" x="30" y="350" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="105" y="373">Caducado</text>
<text class="d-t-s d-c" x="105" y="390">venció el plazo de cargue</text>
<rect class="d-caja-gris" x="270" y="350" width="160" height="60" rx="10"/>
<text class="d-t-b d-c" x="350" y="373">Anulado</text>
<text class="d-t-s d-c" x="350" y="390">terminal</text>
<path class="d-l" d="M85 290 L85 350" marker-end="url(#f)"/>
<rect class="d-rotulo" x="63" y="311" width="44" height="16" rx="4"/>
<text class="d-t-s d-c" x="85" y="323">caduca</text>
<path class="d-l" d="M145 350 L145 290" marker-end="url(#f)"/>
<rect class="d-rotulo" x="122" y="327" width="46" height="16" rx="4"/>
<text class="d-t-s d-c" x="145" y="339">reabrir</text>
<path class="d-l" d="M350 290 L350 350" marker-end="url(#f)"/>
<rect class="d-rotulo" x="328" y="311" width="44" height="16" rx="4"/>
<text class="d-t-s d-c" x="350" y="323">anular</text>
<rect class="d-caja" x="540" y="330" width="490" height="80" rx="10"/>
<text class="d-t-b" x="554" y="353">Tipos de expediente</text>
<text class="d-t-s" x="554" y="370">Inicial: al aceptar la invitación o por apertura manual.</text>
<text class="d-t-s" x="554" y="385">Renovación: al acercarse o llegar el vencimiento del vínculo, o al reintegrarlo con revalidación.</text>
<text class="d-t-s" x="554" y="400">Actualización: una versión nueva cambia lo que la empresa ya aprobó.</text>
<rect class="d-grupo" x="720" y="20" width="320" height="290" rx="14"/>
<text class="d-t-s" x="734" y="38">Qué pasa dentro de «EnRevision»</text>
<rect class="d-caja" x="740" y="50" width="280" height="70" rx="10"/>
<text class="d-t-b d-c" x="880" y="73">Etapa 1</text>
<text class="d-t-s d-c" x="880" y="90">sus áreas revisan en paralelo</text>
<text class="d-t-s d-c" x="880" y="105">cada una con sus aprobadores</text>
<path class="d-l" d="M880 120 L880 150" marker-end="url(#f)"/>
<rect class="d-caja" x="740" y="150" width="280" height="50" rx="10"/>
<text class="d-t-b d-c" x="880" y="173">Etapa 2 … n</text>
<text class="d-t-s d-c" x="880" y="190">solo empieza cuando la anterior aprobó</text>
<path class="d-l" d="M880 200 L880 230" marker-end="url(#f)"/>
<rect class="d-caja-aviso" x="740" y="230" width="280" height="62" rx="10"/>
<text class="d-t-b d-c" x="880" y="253">Verificaciones que bloquean</text>
<text class="d-t-s d-c" x="880" y="270">listas restrictivas y estudio del oficial</text>
<rect class="d-grupo" x="10" y="450" width="1040" height="168" rx="14"/>
<text class="d-t-s" x="24" y="468">Requisito (documento o sección de la ficha) dentro del expediente</text>
<rect class="d-caja-gris" x="30" y="490" width="140" height="50" rx="10"/>
<text class="d-t-b d-c" x="100" y="513">Pendiente</text>
<rect class="d-caja-gris" x="200" y="490" width="140" height="50" rx="10"/>
<text class="d-t-b d-c" x="270" y="513">Cargado</text>
<rect class="d-caja-a" x="370" y="490" width="140" height="50" rx="10"/>
<text class="d-t-b d-c" x="440" y="513">EnRevision</text>
<rect class="d-caja-ok" x="540" y="490" width="140" height="50" rx="10"/>
<text class="d-t-b d-c" x="610" y="513">Aprobado</text>
<path class="d-l" d="M170 515 L200 515" marker-end="url(#f)"/>
<path class="d-l" d="M340 515 L370 515" marker-end="url(#f)"/>
<path class="d-l-ok" d="M510 515 L540 515" marker-end="url(#f-ok)"/>
<rect class="d-caja-aviso" x="710" y="490" width="140" height="50" rx="10"/>
<text class="d-t-b d-c" x="780" y="513">Observado</text>
<path class="d-l" d="M440 490 L440 470 L780 470 L780 490" marker-end="url(#f)"/>
<rect class="d-rotulo" x="584" y="459" width="52" height="16" rx="4"/>
<text class="d-t-s d-c" x="610" y="471">observar</text>
<path class="d-l" d="M750 540 L750 566 L480 566 L480 540" marker-end="url(#f)"/>
<rect class="d-rotulo" x="540" y="555" width="150" height="16" rx="4"/>
<text class="d-t-s d-c" x="615" y="567">el tercero corrige y reenvía</text>
<text class="d-t-s" x="30" y="592">También: Eximido (la empresa lo dispensa), NoAplica (la condición de exigencia no lo pide), Vencido y Desactualizado (lo aprobado dejó de valer o cambió).</text>
</svg>
