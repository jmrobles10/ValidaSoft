<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" class="diagrama" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Ciclo de vida de un certificado</title>
<desc id="descripcion">Estados del certificado de un vínculo: vigente, con pendientes (que se ve «En verificación» mientras el plazo no vence), suspendido, vencido, revocado y reemplazado, con sus transiciones.</desc>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca" d="M0 0L10 5L0 10z"/></marker><marker id="f-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-a" d="M0 0L10 5L0 10z"/></marker><marker id="f-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-ok" d="M0 0L10 5L0 10z"/></marker><marker id="f-peligro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-peligro" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="d-caja-ok" x="400" y="20" width="300" height="60" rx="10"/>
<text class="d-t-b d-c" x="550" y="43">Expediente aprobado</text>
<text class="d-t-s d-c" x="550" y="60">se emite el certificado: folio, PDF y sello</text>
<path class="d-l-ok" d="M550 80 L550 140" marker-end="url(#f-ok)"/>
<rect class="d-grupo" x="380" y="140" width="620" height="190" rx="14"/>
<text class="d-t-s" x="394" y="158">Certificado válido (una sola emisión actual por vínculo)</text>
<rect class="d-caja-ok" x="400" y="180" width="220" height="90" rx="10"/>
<text class="d-t-b d-c" x="510" y="203">Vigente</text>
<text class="d-t-s d-c" x="510" y="220">dentro de su fecha</text>
<rect class="d-caja-aviso" x="760" y="180" width="220" height="90" rx="10"/>
<text class="d-t-b d-c" x="870" y="203">ConPendientes</text>
<text class="d-t-s d-c" x="870" y="220">«En verificación» mientras el plazo</text>
<text class="d-t-s d-c" x="870" y="235">de revalidación no vence; después</text>
<text class="d-t-s d-c" x="870" y="250">bloquea (bloqueado: true)</text>
<path class="d-l" d="M620 205 L760 205" marker-end="url(#f)"/>
<rect class="d-rotulo" x="620" y="186" width="140" height="16" rx="4"/>
<text class="d-t-s d-c" x="690" y="198">se abre una actualización</text>
<path class="d-l" d="M760 250 L620 250" marker-end="url(#f)"/>
<rect class="d-rotulo" x="628" y="251" width="124" height="16" rx="4"/>
<text class="d-t-s d-c" x="690" y="263">se cierra sin aprobar</text>
<rect class="d-caja-gris" x="30" y="190" width="220" height="70" rx="10"/>
<text class="d-t-b d-c" x="140" y="213">Reemplazado</text>
<text class="d-t-s d-c" x="140" y="230">la emisión anterior; sigue verificable</text>
<path class="d-l" d="M400 225 L250 225" marker-end="url(#f)"/>
<rect class="d-rotulo" x="285" y="206" width="80" height="16" rx="4"/>
<text class="d-t-s d-c" x="325" y="218">nueva emisión</text>
<rect class="d-caja-peligro" x="400" y="400" width="220" height="70" rx="10"/>
<text class="d-t-b d-c" x="510" y="423">Suspendido</text>
<text class="d-t-s d-c" x="510" y="440">el vínculo está bloqueado</text>
<path class="d-l" d="M470 330 L470 400" marker-end="url(#f)"/>
<rect class="d-rotulo" x="420" y="344" width="100" height="16" rx="4"/>
<text class="d-t-s d-c" x="470" y="356">vínculo bloqueado</text>
<path class="d-l" d="M550 400 L550 330" marker-end="url(#f)"/>
<rect class="d-rotulo" x="513" y="374" width="74" height="16" rx="4"/>
<text class="d-t-s d-c" x="550" y="386">desbloqueado</text>
<rect class="d-caja-peligro" x="760" y="400" width="220" height="70" rx="10"/>
<text class="d-t-b d-c" x="870" y="423">Vencido</text>
<text class="d-t-s d-c" x="870" y="440">pasó su fecha de vigencia</text>
<path class="d-l" d="M870 330 L870 400" marker-end="url(#f)"/>
<rect class="d-rotulo" x="829" y="354" width="82" height="16" rx="4"/>
<text class="d-t-s d-c" x="870" y="366">pasó la fecha</text>
<rect class="d-caja-peligro" x="30" y="400" width="220" height="70" rx="10"/>
<text class="d-t-b d-c" x="140" y="423">Revocado</text>
<text class="d-t-s d-c" x="140" y="440">irreversible</text>
<path class="d-l-peligro" d="M380 300 L140 300 L140 400" marker-end="url(#f-peligro)"/>
<rect class="d-rotulo" x="165" y="281" width="190" height="16" rx="4"/>
<text class="d-t-s d-c" x="260" y="293">revocar (administrador o sistema)</text>
<text class="d-t-s" x="400" y="500">Al desbloquear, vuelve a su estado previo; si su fecha pasó durante el bloqueo, queda Vencido.</text>
<text class="d-t-s" x="400" y="520">El sistema revoca solo al anular o desvincular el vínculo. «En verificación» no suspende ni bloquea el certificado.</text>
</svg>
