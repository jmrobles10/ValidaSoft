<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 596" class="diagrama" role="img" aria-labelledby="titulo descripcion">
<style>
svg.diagrama{--d-fondo:#ffffff;--d-superficie:#ffffff;--d-superficie2:#eef1f5;--d-borde:#9aa6b5;--d-texto:#1b2129;--d-suave:#596473;--d-linea:#5b6778;--d-acento:#1c5bd0;--d-acento-fondo:#e6eeff;--d-ok:#0b7a4b;--d-ok-fondo:#e3f4ea;--d-aviso:#a85a00;--d-aviso-fondo:#fff3dc;--d-peligro:#bf2a2a;--d-peligro-fondo:#fde8e8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg.diagrama{--d-fondo:#0d1117;--d-superficie:#161b22;--d-superficie2:#1e252e;--d-borde:#566274;--d-texto:#e5e9ef;--d-suave:#99a4b1;--d-linea:#8794a5;--d-acento:#78a6ff;--d-acento-fondo:#1b2a47;--d-ok:#4cc790;--d-ok-fondo:#12281c;--d-aviso:#f0a14a;--d-aviso-fondo:#2a2312;--d-peligro:#f27a7a;--d-peligro-fondo:#3a1a1a}}
.diagrama .d-fondo{fill:var(--d-fondo)}
.diagrama .d-caja{fill:var(--d-superficie);stroke:var(--d-borde);stroke-width:1.4}
.diagrama .d-caja-gris{fill:var(--d-superficie2);stroke:var(--d-borde);stroke-width:1.4}
.diagrama .d-caja-a{fill:var(--d-acento-fondo);stroke:var(--d-acento);stroke-width:1.5}
.diagrama .d-caja-ok{fill:var(--d-ok-fondo);stroke:var(--d-ok);stroke-width:1.5}
.diagrama .d-caja-aviso{fill:var(--d-aviso-fondo);stroke:var(--d-aviso);stroke-width:1.5}
.diagrama .d-caja-peligro{fill:var(--d-peligro-fondo);stroke:var(--d-peligro);stroke-width:1.5}
.diagrama .d-grupo{fill:none;stroke:var(--d-borde);stroke-width:1.3;stroke-dasharray:6 5}
.diagrama .d-carril{fill:var(--d-superficie2);stroke:none}
.diagrama .d-rotulo{fill:var(--d-superficie);stroke:none}
.diagrama .d-t{fill:var(--d-texto);font-size:13px}
.diagrama .d-t-s{fill:var(--d-suave);font-size:11.5px}
.diagrama .d-t-b{fill:var(--d-texto);font-size:13.5px;font-weight:700}
.diagrama .d-t-h{fill:var(--d-texto);font-size:15px;font-weight:700}
.diagrama .d-t-a{fill:var(--d-acento);font-size:12px;font-weight:700}
.diagrama .d-c{text-anchor:middle}
.diagrama .d-num{fill:var(--d-acento);stroke:none}
.diagrama .d-num-t{fill:var(--d-superficie);font-size:11px;font-weight:700;text-anchor:middle}
.diagrama .d-l{fill:none;stroke:var(--d-linea);stroke-width:1.5}
.diagrama .d-l-p{fill:none;stroke:var(--d-linea);stroke-width:1.5;stroke-dasharray:5 4}
.diagrama .d-l-a{fill:none;stroke:var(--d-acento);stroke-width:1.7}
.diagrama .d-l-ok{fill:none;stroke:var(--d-ok);stroke-width:1.7}
.diagrama .d-l-peligro{fill:none;stroke:var(--d-peligro);stroke-width:1.7}
.diagrama .d-marca{fill:var(--d-linea)}
.diagrama .d-marca-a{fill:var(--d-acento)}
.diagrama .d-marca-ok{fill:var(--d-ok)}
.diagrama .d-marca-peligro{fill:var(--d-peligro)}
</style>
<rect class="d-fondo" width="100%" height="100%"/>
<title id="titulo">Ciclo de vida de un documento</title>
<desc id="descripcion">La subida en tres pasos, los estados de una versión (recibida, en análisis, actual, superada, devuelta, retirada y vencida) con sus transiciones, y los estados de vigencia por empresa.</desc>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca" d="M0 0L10 5L0 10z"/></marker><marker id="f-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-a" d="M0 0L10 5L0 10z"/></marker><marker id="f-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-ok" d="M0 0L10 5L0 10z"/></marker><marker id="f-peligro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-peligro" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="d-caja" x="30" y="20" width="300" height="86" rx="10"/>
<text class="d-t-b d-c" x="180" y="43">1 · Declarar</text>
<text class="d-t-s d-c" x="180" y="60">POST /public/v1/boveda/documentos</text>
<text class="d-t-s d-c" x="180" y="75">nombre, tamaño, tipo y SHA-256</text>
<rect class="d-caja" x="380" y="20" width="300" height="86" rx="10"/>
<text class="d-t-b d-c" x="530" y="43">2 · Subir</text>
<text class="d-t-s d-c" x="530" y="60">PUT directo al almacén S3</text>
<text class="d-t-s d-c" x="530" y="75">con la URL prefirmada (15 min)</text>
<rect class="d-caja" x="730" y="20" width="300" height="86" rx="10"/>
<text class="d-t-b d-c" x="880" y="43">3 · Confirmar</text>
<text class="d-t-s d-c" x="880" y="60">POST …/versiones/{n}/confirmar</text>
<text class="d-t-s d-c" x="880" y="75">el servidor lee el archivo y verifica</text>
<text class="d-t-s d-c" x="880" y="90">SHA-256, tipo real y páginas</text>
<path class="d-l" d="M330 63 L380 63" marker-end="url(#f)"/>
<path class="d-l" d="M680 63 L730 63" marker-end="url(#f)"/>
<path class="d-l-a" d="M880 106 L880 150 L105 150 L105 190" marker-end="url(#f-a)"/>
<rect class="d-rotulo" x="430" y="139" width="180" height="16" rx="4"/>
<text class="d-t-s d-c" x="520" y="151">cada versión nace al confirmar</text>
<rect class="d-caja-gris" x="30" y="190" width="150" height="56" rx="10"/>
<text class="d-t-b d-c" x="105" y="213">Recibida</text>
<rect class="d-caja-a" x="250" y="190" width="150" height="56" rx="10"/>
<text class="d-t-b d-c" x="325" y="213">En análisis</text>
<rect class="d-caja-ok" x="470" y="190" width="150" height="56" rx="10"/>
<text class="d-t-b d-c" x="545" y="213">Actual</text>
<text class="d-t-s d-c" x="545" y="230">la vigente</text>
<rect class="d-caja-gris" x="690" y="190" width="150" height="56" rx="10"/>
<text class="d-t-b d-c" x="765" y="213">Superada</text>
<rect class="d-caja" x="880" y="190" width="160" height="56" rx="10"/>
<text class="d-t-b d-c" x="960" y="213">Duplicada</text>
<text class="d-t-s d-c" x="960" y="230">mismo SHA-256: no crea versión</text>
<path class="d-l" d="M180 218 L250 218" marker-end="url(#f)"/>
<path class="d-l" d="M400 218 L470 218" marker-end="url(#f)"/>
<rect class="d-rotulo" x="406" y="196" width="58" height="16" rx="4"/>
<text class="d-t-s d-c" x="435" y="208">hechos ok</text>
<path class="d-l" d="M620 218 L690 218" marker-end="url(#f)"/>
<rect class="d-rotulo" x="624" y="196" width="62" height="16" rx="4"/>
<text class="d-t-s d-c" x="655" y="208">otra actual</text>
<rect class="d-caja-peligro" x="250" y="330" width="150" height="56" rx="10"/>
<text class="d-t-b d-c" x="325" y="353">Devuelta</text>
<path class="d-l-peligro" d="M325 246 L325 330" marker-end="url(#f-peligro)"/>
<text class="d-t-s" x="250" y="402">contenido activo, páginas de más o virus</text>
<rect class="d-caja-aviso" x="470" y="330" width="150" height="56" rx="10"/>
<text class="d-t-b d-c" x="545" y="353">Vencida</text>
<text class="d-t-s d-c" x="545" y="370">sigue siendo la actual</text>
<path class="d-l" d="M495 246 L495 330" marker-end="url(#f)"/>
<rect class="d-rotulo" x="475" y="281" width="40" height="16" rx="4"/>
<text class="d-t-s d-c" x="495" y="293">vence</text>
<path class="d-l" d="M595 330 L595 246" marker-end="url(#f)"/>
<rect class="d-rotulo" x="545" y="281" width="100" height="16" rx="4"/>
<text class="d-t-s d-c" x="595" y="293">renueva o ratifica</text>
<rect class="d-caja-gris" x="690" y="330" width="150" height="56" rx="10"/>
<text class="d-t-b d-c" x="765" y="353">Retirada</text>
<path class="d-l" d="M765 246 L765 330" marker-end="url(#f)"/>
<rect class="d-rotulo" x="710" y="277" width="110" height="16" rx="4"/>
<text class="d-t-s d-c" x="765" y="289">el tercero la retira</text>
<text class="d-t-s" x="690" y="412">También se retira desde Actual o Vencida; si era la actual,</text>
<text class="d-t-s" x="690" y="428">la superada más reciente vuelve a ser la actual.</text>
<text class="d-t-s" x="30" y="290">Sin antivirus conectado una versión pasa de</text>
<text class="d-t-s" x="30" y="306">Recibida a Actual en la misma confirmación;</text>
<text class="d-t-s" x="30" y="322">con ExigirAntivirus queda esperando en «En análisis».</text>
<rect class="d-grupo" x="20" y="450" width="1030" height="130" rx="14"/>
<text class="d-t-s" x="34" y="468">Vigencia de la versión actual, por empresa y vínculo (cada empresa tiene sus propios días de aviso y de gracia)</text>
<rect class="d-caja-ok" x="30" y="500" width="170" height="50" rx="10"/>
<text class="d-t-b d-c" x="115" y="523">Vigente</text>
<rect class="d-caja-aviso" x="270" y="500" width="170" height="50" rx="10"/>
<text class="d-t-b d-c" x="355" y="523">Por vencer</text>
<rect class="d-caja-aviso" x="510" y="500" width="170" height="50" rx="10"/>
<text class="d-t-b d-c" x="595" y="523">En gracia</text>
<rect class="d-caja-peligro" x="750" y="500" width="170" height="50" rx="10"/>
<text class="d-t-b d-c" x="835" y="523">Vencida</text>
<path class="d-l" d="M200 525 L270 525" marker-end="url(#f)"/>
<rect class="d-rotulo" x="215" y="503" width="40" height="16" rx="4"/>
<text class="d-t-s d-c" x="235" y="515">aviso</text>
<path class="d-l" d="M440 525 L510 525" marker-end="url(#f)"/>
<rect class="d-rotulo" x="455" y="503" width="40" height="16" rx="4"/>
<text class="d-t-s d-c" x="475" y="515">fecha</text>
<path class="d-l" d="M680 525 L750 525" marker-end="url(#f)"/>
<rect class="d-rotulo" x="677" y="503" width="76" height="16" rx="4"/>
<text class="d-t-s d-c" x="715" y="515">fin de gracia</text>
<rect class="d-caja" x="930" y="500" width="110" height="50" rx="10"/>
<text class="d-t-b d-c" x="985" y="523">Sin vencimiento</text>
</svg>
