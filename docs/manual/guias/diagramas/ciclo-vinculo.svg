<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" class="diagrama" role="img" aria-labelledby="titulo descripcion">
<style>
svg.diagrama{--d-fondo:#ffffff;--d-superficie:#ffffff;--d-superficie2:#eef1f5;--d-borde:#9aa6b5;--d-texto:#1b2129;--d-suave:#596473;--d-linea:#5b6778;--d-acento:#1c5bd0;--d-acento-fondo:#e6eeff;--d-ok:#0b7a4b;--d-ok-fondo:#e3f4ea;--d-aviso:#a85a00;--d-aviso-fondo:#fff3dc;--d-peligro:#bf2a2a;--d-peligro-fondo:#fde8e8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg.diagrama{--d-fondo:#0d1117;--d-superficie:#161b22;--d-superficie2:#1e252e;--d-borde:#566274;--d-texto:#e5e9ef;--d-suave:#99a4b1;--d-linea:#8794a5;--d-acento:#78a6ff;--d-acento-fondo:#1b2a47;--d-ok:#4cc790;--d-ok-fondo:#12281c;--d-aviso:#f0a14a;--d-aviso-fondo:#2a2312;--d-peligro:#f27a7a;--d-peligro-fondo:#3a1a1a}}
.diagrama .d-fondo{fill:var(--d-fondo)}
.diagrama .d-caja{fill:var(--d-superficie);stroke:var(--d-borde);stroke-width:1.4}
.diagrama .d-caja-gris{fill:var(--d-superficie2);stroke:var(--d-borde);stroke-width:1.4}
.diagrama .d-caja-a{fill:var(--d-acento-fondo);stroke:var(--d-acento);stroke-width:1.5}
.diagrama .d-caja-ok{fill:var(--d-ok-fondo);stroke:var(--d-ok);stroke-width:1.5}
.diagrama .d-caja-aviso{fill:var(--d-aviso-fondo);stroke:var(--d-aviso);stroke-width:1.5}
.diagrama .d-caja-peligro{fill:var(--d-peligro-fondo);stroke:var(--d-peligro);stroke-width:1.5}
.diagrama .d-grupo{fill:none;stroke:var(--d-borde);stroke-width:1.3;stroke-dasharray:6 5}
.diagrama .d-carril{fill:var(--d-superficie2);stroke:none}
.diagrama .d-rotulo{fill:var(--d-superficie);stroke:none}
.diagrama .d-t{fill:var(--d-texto);font-size:13px}
.diagrama .d-t-s{fill:var(--d-suave);font-size:11.5px}
.diagrama .d-t-b{fill:var(--d-texto);font-size:13.5px;font-weight:700}
.diagrama .d-t-h{fill:var(--d-texto);font-size:15px;font-weight:700}
.diagrama .d-t-a{fill:var(--d-acento);font-size:12px;font-weight:700}
.diagrama .d-c{text-anchor:middle}
.diagrama .d-num{fill:var(--d-acento);stroke:none}
.diagrama .d-num-t{fill:var(--d-superficie);font-size:11px;font-weight:700;text-anchor:middle}
.diagrama .d-l{fill:none;stroke:var(--d-linea);stroke-width:1.5}
.diagrama .d-l-p{fill:none;stroke:var(--d-linea);stroke-width:1.5;stroke-dasharray:5 4}
.diagrama .d-l-a{fill:none;stroke:var(--d-acento);stroke-width:1.7}
.diagrama .d-l-ok{fill:none;stroke:var(--d-ok);stroke-width:1.7}
.diagrama .d-l-peligro{fill:none;stroke:var(--d-peligro);stroke-width:1.7}
.diagrama .d-marca{fill:var(--d-linea)}
.diagrama .d-marca-a{fill:var(--d-acento)}
.diagrama .d-marca-ok{fill:var(--d-ok)}
.diagrama .d-marca-peligro{fill:var(--d-peligro)}
</style>
<rect class="d-fondo" width="100%" height="100%"/>
<title id="titulo">Ciclo de vida de un vínculo</title>
<desc id="descripcion">Estados del vínculo entre una empresa y un tercero y sus transiciones: invitado, en validación, activo, por vencer, vencido, bloqueado, desvinculado y anulado.</desc>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca" d="M0 0L10 5L0 10z"/></marker><marker id="f-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-a" d="M0 0L10 5L0 10z"/></marker><marker id="f-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-ok" d="M0 0L10 5L0 10z"/></marker><marker id="f-peligro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-peligro" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="d-grupo" x="10" y="20" width="1000" height="490" rx="14"/>
<text class="d-t-s" x="24" y="38">Estados con vida</text>
<rect class="d-caja-gris" x="30" y="70" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="105" y="93">Invitado</text>
<text class="d-t-s d-c" x="105" y="110">sin expediente abierto</text>
<rect class="d-caja-a" x="300" y="70" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="375" y="93">EnValidacion</text>
<text class="d-t-s d-c" x="375" y="110">expediente abierto</text>
<rect class="d-caja-ok" x="570" y="70" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="645" y="93">Activo</text>
<text class="d-t-s d-c" x="645" y="110">aprobado y vigente</text>
<rect class="d-caja-aviso" x="840" y="70" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="915" y="93">PorVencer</text>
<text class="d-t-s d-c" x="915" y="110">avisó; aún vale</text>
<rect class="d-caja-peligro" x="840" y="230" width="150" height="70" rx="10"/>
<text class="d-t-b d-c" x="915" y="253">Vencido</text>
<text class="d-t-s d-c" x="915" y="270">falta renovar</text>
<rect class="d-caja-peligro" x="570" y="400" width="150" height="70" rx="10"/>
<text class="d-t-b d-c" x="645" y="423">Bloqueado</text>
<text class="d-t-s d-c" x="645" y="440">privado de la empresa</text>
<text class="d-t-s" x="30" y="270">En revisión no es un estado: es una</text>
<text class="d-t-s" x="30" y="286">situación de Activo, PorVencer o Vencido</text>
<text class="d-t-s" x="30" y="302">con un expediente de actualización abierto.</text>
<path class="d-l" d="M180 92 L300 92" marker-end="url(#f)"/>
<rect class="d-rotulo" x="193" y="73" width="94" height="16" rx="4"/>
<text class="d-t-s d-c" x="240" y="85">abre expediente</text>
<path class="d-l" d="M300 116 L180 116" marker-end="url(#f)"/>
<rect class="d-rotulo" x="205" y="115" width="70" height="16" rx="4"/>
<text class="d-t-s d-c" x="240" y="127">no aprobado</text>
<path class="d-l" d="M450 92 L570 92" marker-end="url(#f)"/>
<rect class="d-rotulo" x="484" y="73" width="52" height="16" rx="4"/>
<text class="d-t-s d-c" x="510" y="85">aprobado</text>
<path class="d-l" d="M570 116 L450 116" marker-end="url(#f)"/>
<rect class="d-rotulo" x="478" y="115" width="64" height="16" rx="4"/>
<text class="d-t-s d-c" x="510" y="127">desaprobar</text>
<path class="d-l" d="M720 92 L840 92" marker-end="url(#f)"/>
<rect class="d-rotulo" x="762" y="73" width="36" height="16" rx="4"/>
<text class="d-t-s d-c" x="780" y="85">aviso</text>
<path class="d-l" d="M840 116 L720 116" marker-end="url(#f)"/>
<rect class="d-rotulo" x="752" y="115" width="56" height="16" rx="4"/>
<text class="d-t-s d-c" x="780" y="127">renovado</text>
<path class="d-l" d="M915 130 L915 230" marker-end="url(#f)"/>
<rect class="d-rotulo" x="920" y="171" width="40" height="16" rx="4"/>
<text class="d-t-s d-c" x="940" y="183">vence</text>
<path class="d-l" d="M840 265 L675 265 L675 130" marker-end="url(#f)"/>
<rect class="d-rotulo" x="730" y="248" width="56" height="16" rx="4"/>
<text class="d-t-s d-c" x="758" y="260">renovado</text>
<path class="d-l" d="M610 130 L610 400" marker-start="url(#f)" marker-end="url(#f)"/>
<rect class="d-rotulo" x="480" y="289" width="120" height="16" rx="4"/>
<text class="d-t-s d-c" x="540" y="301">bloquear · desbloquear</text>
<rect class="d-caja-gris" x="300" y="550" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="375" y="573">Desvinculado</text>
<text class="d-t-s d-c" x="375" y="590">terminado, reintegrable</text>
<rect class="d-caja-gris" x="840" y="550" width="150" height="60" rx="10"/>
<text class="d-t-b d-c" x="915" y="573">Anulado</text>
<text class="d-t-s d-c" x="915" y="590">terminal</text>
<path class="d-l" d="M345 510 L345 550" marker-end="url(#f)"/>
<rect class="d-rotulo" x="265" y="519" width="70" height="16" rx="4"/>
<text class="d-t-s d-c" x="300" y="531">desvincular</text>
<path class="d-l" d="M405 550 L405 510" marker-end="url(#f)"/>
<rect class="d-rotulo" x="434" y="519" width="62" height="16" rx="4"/>
<text class="d-t-s d-c" x="465" y="531">reintegrar</text>
<path class="d-l" d="M915 510 L915 550" marker-end="url(#f)"/>
<rect class="d-rotulo" x="938" y="519" width="44" height="16" rx="4"/>
<text class="d-t-s d-c" x="960" y="531">anular</text>
</svg>
