<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 784" class="diagrama" role="img" aria-labelledby="titulo descripcion">
<style>
svg.diagrama{--d-fondo:#ffffff;--d-superficie:#ffffff;--d-superficie2:#eef1f5;--d-borde:#9aa6b5;--d-texto:#1b2129;--d-suave:#596473;--d-linea:#5b6778;--d-acento:#1c5bd0;--d-acento-fondo:#e6eeff;--d-ok:#0b7a4b;--d-ok-fondo:#e3f4ea;--d-aviso:#a85a00;--d-aviso-fondo:#fff3dc;--d-peligro:#bf2a2a;--d-peligro-fondo:#fde8e8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg.diagrama{--d-fondo:#0d1117;--d-superficie:#161b22;--d-superficie2:#1e252e;--d-borde:#566274;--d-texto:#e5e9ef;--d-suave:#99a4b1;--d-linea:#8794a5;--d-acento:#78a6ff;--d-acento-fondo:#1b2a47;--d-ok:#4cc790;--d-ok-fondo:#12281c;--d-aviso:#f0a14a;--d-aviso-fondo:#2a2312;--d-peligro:#f27a7a;--d-peligro-fondo:#3a1a1a}}
.diagrama .d-fondo{fill:var(--d-fondo)}
.diagrama .d-caja{fill:var(--d-superficie);stroke:var(--d-borde);stroke-width:1.4}
.diagrama .d-caja-gris{fill:var(--d-superficie2);stroke:var(--d-borde);stroke-width:1.4}
.diagrama .d-caja-a{fill:var(--d-acento-fondo);stroke:var(--d-acento);stroke-width:1.5}
.diagrama .d-caja-ok{fill:var(--d-ok-fondo);stroke:var(--d-ok);stroke-width:1.5}
.diagrama .d-caja-aviso{fill:var(--d-aviso-fondo);stroke:var(--d-aviso);stroke-width:1.5}
.diagrama .d-caja-peligro{fill:var(--d-peligro-fondo);stroke:var(--d-peligro);stroke-width:1.5}
.diagrama .d-grupo{fill:none;stroke:var(--d-borde);stroke-width:1.3;stroke-dasharray:6 5}
.diagrama .d-carril{fill:var(--d-superficie2);stroke:none}
.diagrama .d-rotulo{fill:var(--d-superficie);stroke:none}
.diagrama .d-t{fill:var(--d-texto);font-size:13px}
.diagrama .d-t-s{fill:var(--d-suave);font-size:11.5px}
.diagrama .d-t-b{fill:var(--d-texto);font-size:13.5px;font-weight:700}
.diagrama .d-t-h{fill:var(--d-texto);font-size:15px;font-weight:700}
.diagrama .d-t-a{fill:var(--d-acento);font-size:12px;font-weight:700}
.diagrama .d-c{text-anchor:middle}
.diagrama .d-num{fill:var(--d-acento);stroke:none}
.diagrama .d-num-t{fill:var(--d-superficie);font-size:11px;font-weight:700;text-anchor:middle}
.diagrama .d-l{fill:none;stroke:var(--d-linea);stroke-width:1.5}
.diagrama .d-l-p{fill:none;stroke:var(--d-linea);stroke-width:1.5;stroke-dasharray:5 4}
.diagrama .d-l-a{fill:none;stroke:var(--d-acento);stroke-width:1.7}
.diagrama .d-l-ok{fill:none;stroke:var(--d-ok);stroke-width:1.7}
.diagrama .d-l-peligro{fill:none;stroke:var(--d-peligro);stroke-width:1.7}
.diagrama .d-marca{fill:var(--d-linea)}
.diagrama .d-marca-a{fill:var(--d-acento)}
.diagrama .d-marca-ok{fill:var(--d-ok)}
.diagrama .d-marca-peligro{fill:var(--d-peligro)}
</style>
<rect class="d-fondo" width="100%" height="100%"/>
<title id="titulo">Del certificado a la actualización, por actor</title>
<desc id="descripcion">Diagrama por actor: Validasoft emite el certificado, el sistema integrador lo consulta y el público lo verifica; con el tiempo vencen documentos y vínculo; el tercero ratifica o sube una versión nueva, cada empresa revisa solo lo que cambió y puede bloquear o desbloquear el vínculo.</desc>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca" d="M0 0L10 5L0 10z"/></marker><marker id="f-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-a" d="M0 0L10 5L0 10z"/></marker><marker id="f-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-ok" d="M0 0L10 5L0 10z"/></marker><marker id="f-peligro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-peligro" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="d-carril" x="10" y="10" width="204" height="764" rx="8"/>
<rect class="d-caja" x="18" y="18" width="188" height="34" rx="10"/>
<text class="d-t-b d-c" x="112" y="40">Validasoft</text>
<rect class="d-carril" x="224" y="10" width="204" height="764" rx="8"/>
<rect class="d-caja" x="232" y="18" width="188" height="34" rx="10"/>
<text class="d-t-b d-c" x="326" y="40">Sistema integrador</text>
<rect class="d-carril" x="438" y="10" width="204" height="764" rx="8"/>
<rect class="d-caja" x="446" y="18" width="188" height="34" rx="10"/>
<text class="d-t-b d-c" x="540" y="40">Público</text>
<rect class="d-carril" x="652" y="10" width="204" height="764" rx="8"/>
<rect class="d-caja" x="660" y="18" width="188" height="34" rx="10"/>
<text class="d-t-b d-c" x="754" y="40">Tercero</text>
<rect class="d-carril" x="866" y="10" width="204" height="764" rx="8"/>
<rect class="d-caja" x="874" y="18" width="188" height="34" rx="10"/>
<text class="d-t-b d-c" x="968" y="40">Empresa</text>
<rect class="d-caja-ok" x="20" y="80" width="184" height="64" rx="10"/>
<text class="d-t d-c" x="112" y="100">Emite el certificado:</text>
<text class="d-t-s d-c" x="112" y="115">folio, PDF y sello</text>
<circle class="d-num" cx="26" cy="88" r="10"/><text class="d-num-t" x="26" y="92">1</text>
<rect class="d-caja" x="234" y="168" width="184" height="64" rx="10"/>
<text class="d-t d-c" x="326" y="188">Recibe certificado.emitido</text>
<text class="d-t-s d-c" x="326" y="203">y consulta antes de pagar</text>
<circle class="d-num" cx="240" cy="176" r="10"/><text class="d-num-t" x="240" y="180">2</text>
<rect class="d-caja" x="448" y="168" width="184" height="64" rx="10"/>
<text class="d-t d-c" x="540" y="188">Verifica el folio</text>
<text class="d-t-s d-c" x="540" y="203">en /verificar/{folio}</text>
<circle class="d-num" cx="454" cy="176" r="10"/><text class="d-num-t" x="454" y="180">3</text>
<rect class="d-caja-aviso" x="20" y="256" width="184" height="64" rx="10"/>
<text class="d-t d-c" x="112" y="276">Avisa y vence:</text>
<text class="d-t-s d-c" x="112" y="291">documentos, vínculo</text>
<text class="d-t-s d-c" x="112" y="304">y certificado</text>
<circle class="d-num" cx="26" cy="264" r="10"/><text class="d-num-t" x="26" y="268">4</text>
<rect class="d-caja" x="662" y="344" width="184" height="64" rx="10"/>
<text class="d-t d-c" x="754" y="364">Ratifica o actualiza</text>
<text class="d-t-s d-c" x="754" y="379">su información</text>
<circle class="d-num" cx="668" cy="352" r="10"/><text class="d-num-t" x="668" y="356">5</text>
<rect class="d-caja" x="662" y="432" width="184" height="64" rx="10"/>
<text class="d-t d-c" x="754" y="452">Sube una versión nueva</text>
<text class="d-t-s d-c" x="754" y="467">de un documento</text>
<circle class="d-num" cx="668" cy="440" r="10"/><text class="d-num-t" x="668" y="444">6</text>
<rect class="d-caja-a" x="20" y="520" width="184" height="64" rx="10"/>
<text class="d-t d-c" x="112" y="540">Comparte con cada</text>
<text class="d-t-s d-c" x="112" y="555">empresa que lo exige:</text>
<text class="d-t-s d-c" x="112" y="568">vínculo «En revisión»</text>
<circle class="d-num" cx="26" cy="528" r="10"/><text class="d-num-t" x="26" y="532">7</text>
<rect class="d-caja" x="876" y="608" width="184" height="64" rx="10"/>
<text class="d-t d-c" x="968" y="628">Revisa lo que cambió:</text>
<text class="d-t-s d-c" x="968" y="643">aprueba, observa</text>
<text class="d-t-s d-c" x="968" y="656">o rechaza</text>
<circle class="d-num" cx="882" cy="616" r="10"/><text class="d-num-t" x="882" y="620">8</text>
<rect class="d-caja-peligro" x="876" y="696" width="184" height="64" rx="10"/>
<text class="d-t d-c" x="968" y="716">Puede bloquear y</text>
<text class="d-t-s d-c" x="968" y="731">desbloquear el vínculo</text>
<circle class="d-num" cx="882" cy="704" r="10"/><text class="d-num-t" x="882" y="708">9</text>
<path class="d-l" d="M112 144 L112 156 L326 156 L326 168" marker-end="url(#f)"/>
<path class="d-l" d="M112 144 L112 156 L540 156 L540 168" marker-end="url(#f)"/>
<path class="d-l-p" d="M112 144 L112 256" marker-end="url(#f)"/>
<path class="d-l" d="M112 320 L112 332 L754 332 L754 344" marker-end="url(#f)"/>
<path class="d-l" d="M754 408 L754 432" marker-end="url(#f)"/>
