<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" class="diagrama" role="img" aria-labelledby="titulo descripcion">
<style>
svg.diagrama{--d-fondo:#ffffff;--d-superficie:#ffffff;--d-superficie2:#eef1f5;--d-borde:#9aa6b5;--d-texto:#1b2129;--d-suave:#596473;--d-linea:#5b6778;--d-acento:#1c5bd0;--d-acento-fondo:#e6eeff;--d-ok:#0b7a4b;--d-ok-fondo:#e3f4ea;--d-aviso:#a85a00;--d-aviso-fondo:#fff3dc;--d-peligro:#bf2a2a;--d-peligro-fondo:#fde8e8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg.diagrama{--d-fondo:#0d1117;--d-superficie:#161b22;--d-superficie2:#1e252e;--d-borde:#566274;--d-texto:#e5e9ef;--d-suave:#99a4b1;--d-linea:#8794a5;--d-acento:#78a6ff;--d-acento-fondo:#1b2a47;--d-ok:#4cc790;--d-ok-fondo:#12281c;--d-aviso:#f0a14a;--d-aviso-fondo:#2a2312;--d-peligro:#f27a7a;--d-peligro-fondo:#3a1a1a}}
.diagrama .d-fondo{fill:var(--d-fondo)}
.diagrama .d-caja{fill:var(--d-superficie);stroke:var(--d-borde);stroke-width:1.4}
.diagrama .d-caja-gris{fill:var(--d-superficie2);stroke:var(--d-borde);stroke-width:1.4}
.diagrama .d-caja-a{fill:var(--d-acento-fondo);stroke:var(--d-acento);stroke-width:1.5}
.diagrama .d-caja-ok{fill:var(--d-ok-fondo);stroke:var(--d-ok);stroke-width:1.5}
.diagrama .d-caja-aviso{fill:var(--d-aviso-fondo);stroke:var(--d-aviso);stroke-width:1.5}
.diagrama .d-caja-peligro{fill:var(--d-peligro-fondo);stroke:var(--d-peligro);stroke-width:1.5}
.diagrama .d-grupo{fill:none;stroke:var(--d-borde);stroke-width:1.3;stroke-dasharray:6 5}
.diagrama .d-carril{fill:var(--d-superficie2);stroke:none}
.diagrama .d-rotulo{fill:var(--d-superficie);stroke:none}
.diagrama .d-t{fill:var(--d-texto);font-size:13px}
.diagrama .d-t-s{fill:var(--d-suave);font-size:11.5px}
.diagrama .d-t-b{fill:var(--d-texto);font-size:13.5px;font-weight:700}
.diagrama .d-t-h{fill:var(--d-texto);font-size:15px;font-weight:700}
.diagrama .d-t-a{fill:var(--d-acento);font-size:12px;font-weight:700}
.diagrama .d-c{text-anchor:middle}
.diagrama .d-num{fill:var(--d-acento);stroke:none}
.diagrama .d-num-t{fill:var(--d-superficie);font-size:11px;font-weight:700;text-anchor:middle}
.diagrama .d-l{fill:none;stroke:var(--d-linea);stroke-width:1.5}
.diagrama .d-l-p{fill:none;stroke:var(--d-linea);stroke-width:1.5;stroke-dasharray:5 4}
.diagrama .d-l-a{fill:none;stroke:var(--d-acento);stroke-width:1.7}
.diagrama .d-l-ok{fill:none;stroke:var(--d-ok);stroke-width:1.7}
.diagrama .d-l-peligro{fill:none;stroke:var(--d-peligro);stroke-width:1.7}
.diagrama .d-marca{fill:var(--d-linea)}
.diagrama .d-marca-a{fill:var(--d-acento)}
.diagrama .d-marca-ok{fill:var(--d-ok)}
.diagrama .d-marca-peligro{fill:var(--d-peligro)}
</style>
<rect class="d-fondo" width="100%" height="100%"/>
<title id="titulo">Multi-tenencia y bóveda global</title>
<desc id="descripcion">La bóveda del tercero es global y se comparte con cada vínculo solo después de aceptar la invitación; dentro de un grupo cada empresa decide en privado; un grupo no ve a otro.</desc>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca" d="M0 0L10 5L0 10z"/></marker><marker id="f-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-a" d="M0 0L10 5L0 10z"/></marker><marker id="f-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-ok" d="M0 0L10 5L0 10z"/></marker><marker id="f-peligro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-marca-peligro" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="d-caja-gris" x="30" y="20" width="1020" height="62" rx="10"/>
<text class="d-t-b d-c" x="540" y="43">Plataforma e identidad (globales, sin grupo)</text>
<text class="d-t-s d-c" x="540" y="60">grupos y empresas, planes, catálogos, textos legales · passkeys, sesiones y enlaces de acceso</text>
<rect class="d-grupo" x="30" y="110" width="330" height="540" rx="14"/>
<text class="d-t-s" x="44" y="128">Bóveda del tercero · global · tenant técnico «boveda»</text>
<rect class="d-caja-ok" x="50" y="150" width="290" height="70" rx="10"/>
<text class="d-t-b d-c" x="195" y="173">Tercero</text>
<text class="d-t-s d-c" x="195" y="190">Aceros S.A.S.</text>
<text class="d-t-s d-c" x="195" y="205">clave única: país + tipo + número</text>
<rect class="d-caja-ok" x="50" y="240" width="290" height="140" rx="10"/>
<text class="d-t-b d-c" x="195" y="263">Documento RUT</text>
<text class="d-t-s d-c" x="195" y="280">v1 superada · v2 actual</text>
<text class="d-t-s d-c" x="195" y="295">archivo en el almacén por SHA-256</text>
<text class="d-t-s d-c" x="195" y="310">hechos y análisis de IA, una sola vez</text>
<text class="d-t-s d-c" x="195" y="325">cada versión es inmutable</text>
<rect class="d-caja-ok" x="50" y="400" width="290" height="80" rx="10"/>
<text class="d-t-b d-c" x="195" y="423">Ficha maestra</text>
<text class="d-t-s d-c" x="195" y="440">seis secciones con sus versiones</text>
<text class="d-t-s d-c" x="195" y="455">y la declaración PEP</text>
<rect class="d-caja-ok" x="50" y="500" width="290" height="60" rx="10"/>
<text class="d-t-b d-c" x="195" y="523">Cuentas bancarias del tercero</text>
<text class="d-t-s" x="50" y="590">Se consulta por tercero. Una empresa solo ve una</text>
<text class="d-t-s" x="50" y="606">versión si hay una compartición hacia su vínculo.</text>
<rect class="d-grupo" x="420" y="110" width="630" height="400" rx="14"/>
<text class="d-t-s" x="434" y="128">Grupo «Constructora» · un tenant_id en cada fila y cada evento</text>
<rect class="d-caja-gris" x="440" y="150" width="590" height="56" rx="10"/>
<text class="d-t-b d-c" x="735" y="173">Configuración del grupo</text>
<text class="d-t-s d-c" x="735" y="190">usuarios y roles · tipos de documento y de vínculo · API keys · webhooks · plan</text>
<rect class="d-grupo" x="440" y="230" width="280" height="230" rx="14"/>
<text class="d-t-b" x="454" y="252">Empresa Norte</text>
<rect class="d-caja-a" x="456" y="268" width="248" height="52" rx="10"/>
<text class="d-t-b d-c" x="580" y="291">Vínculo PROVEEDOR</text>
<text class="d-t-s d-c" x="580" y="308">empresa_id, tercero y tipo</text>
<rect class="d-caja-a" x="456" y="332" width="248" height="52" rx="10"/>
<text class="d-t-b d-c" x="580" y="355">Expediente y decisiones</text>
<text class="d-t-s d-c" x="580" y="372">privados de la empresa</text>
<rect class="d-caja-a" x="456" y="396" width="248" height="52" rx="10"/>
<text class="d-t-b d-c" x="580" y="419">Certificado y bloqueo</text>
<text class="d-t-s d-c" x="580" y="436">privados de la empresa</text>
<rect class="d-grupo" x="750" y="230" width="280" height="230" rx="14"/>
<text class="d-t-b" x="764" y="252">Empresa Sur</text>
<rect class="d-caja-a" x="766" y="268" width="248" height="52" rx="10"/>
<text class="d-t-b d-c" x="890" y="291">Vínculo PROVEEDOR</text>
<text class="d-t-s d-c" x="890" y="308">empresa_id, tercero y tipo</text>
<rect class="d-caja-a" x="766" y="332" width="248" height="52" rx="10"/>
<text class="d-t-b d-c" x="890" y="355">Expediente y decisiones</text>
<text class="d-t-s d-c" x="890" y="372">privados de la empresa</text>
<rect class="d-caja-a" x="766" y="396" width="248" height="52" rx="10"/>
<text class="d-t-b d-c" x="890" y="419">Certificado y bloqueo</text>
<text class="d-t-s d-c" x="890" y="436">privados de la empresa</text>
<text class="d-t-s d-c" x="735" y="492">Dentro del grupo, lo de otra empresa responde 404: la empresa activa filtra cada lectura.</text>
<path class="d-l-ok" d="M340 320 L400 320 L400 294 L456 294" marker-end="url(#f-ok)"/>
<path class="d-l-ok" d="M400 320 L400 530 L736 530 L736 294 L766 294" marker-end="url(#f-ok)"/>
<rect class="d-rotulo" x="390" y="519" width="360" height="16" rx="4"/>
<text class="d-t-s d-c" x="570" y="531">compartición: solo después de que el tercero acepta la invitación</text>
<rect class="d-grupo" x="420" y="560" width="630" height="100" rx="14"/>
<text class="d-t-s" x="434" y="578">Otro grupo (otro tenant_id)</text>
<rect class="d-caja" x="440" y="590" width="590" height="52" rx="10"/>
<text class="d-t-b d-c" x="735" y="613">Sus empresas, usuarios, llaves, flujos y vínculos</text>
<text class="d-t-s d-c" x="735" y="630">nada se mezcla con el grupo de arriba; un recurso de otro grupo también responde 404</text>
</svg>
